<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Whatss</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #18181b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 420px; }
    .logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, #10b981, #3b82f6);
      color: #fff; font-size: 24px; font-weight: 800;
      box-shadow: 0 8px 24px -8px rgba(16, 185, 129, 0.5);
      margin-bottom: 24px;
    }
    h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    p { color: #71717a; font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    a {
      display: inline-flex; align-items: center; gap: 8px;
      background: #18181b; color: #fff; text-decoration: none;
      padding: 12px 24px; border-radius: 999px;
      font-size: 14px; font-weight: 600;
      transition: background 0.2s;
    }
    a:hover { background: #27272a; }
    .lang {
      display: block; margin-top: 16px;
      background: none; color: #71717a; font-size: 13px; font-weight: 500;
    }
    .lang:hover { color: #18181b; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">W</div>
    <h1>Page not found</h1>
    <p>The address you are looking for does not exist or has been moved.<br>Go back to the Whatss home page.</p>
    <a href="/">← Back to Home</a>
    <a class="lang" href="/">Português</a>
  </div>
</body>
</html>
